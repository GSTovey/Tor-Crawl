allow-lan: true
external-controller: 0.0.0.0:9090
ipv6: false
log-level: info
mixed-port: 7890
mode: global
proxies:
- alterId: 0
  cipher: auto
  name: 'VMess node'
  port: 2235
  server: YOUR_VMESS_SERVER
  type: vmess
  udp: true
  uuid: YOUR_UUID
proxy-groups:
- interval: 30
  name: Proxy
  proxies:
  - 'VMess node'
  tolerance: 50
  type: url-test
  url: https://www.gstatic.com/generate_204
rules:
- MATCH,Proxy
tun:
  enable: false

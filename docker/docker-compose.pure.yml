# Pure proxy capture (no Tor) — per protocol
# Xray → direct HTTP → tcpdump → pure_output/

x-pure: &pure
  build:
    context: ..
    dockerfile: docker/Dockerfile
  restart: "no"
  cap_add: [NET_ADMIN, NET_RAW]
  environment:
    TARGET_TOTAL: 10000
    MAX_PCAPS: 10
    FETCH_NODES: "0"
    OUTPUT_DIR: /app/pure_output
  volumes:
    - ./entrypoints/entrypoint_pure.sh:/entrypoint.sh:ro
    - ./capture/crawl_pcap_pure.py:/app/docker/crawl_pcap_pure.py:ro
    - ./configs/top1000.txt:/app/docker/configs/top1000.txt:ro
    - ../pure_output:/app/pure_output
  entrypoint: ["/bin/bash", "/entrypoint.sh"]

services:
  pure-vless:
    <<: *pure
    container_name: pure-vless
    environment:
      TARGET_TOTAL: 10000
      MAX_PCAPS: 10
      PROTOCOL: vless
      OUTPUT_DIR: /app/pure_output
    volumes:
      - ./entrypoints/entrypoint_pure.sh:/entrypoint.sh:ro
      - ./capture/crawl_pcap_pure.py:/app/docker/crawl_pcap_pure.py:ro
      - ./configs/top1000.txt:/app/docker/configs/top1000.txt:ro
      - ./configs/xray-vless.json:/etc/xray/config.json:ro
      - ../pure_output:/app/pure_output

  pure-hysteria2:

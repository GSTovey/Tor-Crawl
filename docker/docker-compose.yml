# =============================================================================
# TorCrawl.py - Docker Compose
# Multi-protocol Tor-over-Proxy crawlers with automatic node failover
#
# Each service: Xray (multi-node+balancer) -> Tor -> Crawler
# Nodes auto-fetched from GitHub at startup (set FETCH_NODES=0 to skip)
#
# Usage:
#   docker compose up torcrawl-vless -d     # Single protocol
#   docker compose up -d                    # All 4 protocols
#   docker compose logs -f                 # Follow all logs
#   docker compose down                     # Stop all
# =============================================================================

# -------------------------------------------------------------------
# Common config anchors
# -------------------------------------------------------------------
x-build: &build
  context: ..
  dockerfile: docker/Dockerfile

x-env: &env
  FETCH_NODES: ${FETCH_NODES:-0}
  MAX_NODES: ${MAX_NODES:-15}
  MAX_PCAPS: ${MAX_PCAPS:-10}
  TARGET_TOTAL: ${TARGET_TOTAL:-10000}
  CRAWL_URL: ${CRAWL_URL:-https://check.torproject.org}
  CRAWL_DEPTH: ${CRAWL_DEPTH:-1}
  CRAWL_PAUSE: ${CRAWL_PAUSE:-2}

# tcpdump needs NET_ADMIN (or NET_RAW) for packet capture
x-capabilities: &caps
  - NET_ADMIN
  - NET_RAW

# -------------------------------------------------------------------
# Services
# -------------------------------------------------------------------
services:

  torcrawl-ss:
    build: *build
    container_name: torcrawl-ss
    restart: "no"
    cap_add: *caps
    environment:
      <<: *env
      PROTOCOL: ss
    volumes:
      - ./configs/torrc:/etc/tor/torrc:ro
      - ./configs/xray-ss.json:/etc/xray/config.json:ro
      - ../output:/app/output
    networks:
      - crawl-net

  torcrawl-trojan:
    build: *build
    container_name: torcrawl-trojan
    restart: "no"
    cap_add: *caps
    environment:
      <<: *env
      PROTOCOL: trojan
    volumes:
      - ./configs/torrc:/etc/tor/torrc:ro
      - ./configs/xray-trojan.json:/etc/xray/config.json:ro
      - ../output:/app/output
    networks:
      - crawl-net

  torcrawl-vmess:
    build: *build
    container_name: torcrawl-vmess
    restart: "no"
    cap_add: *caps
    environment:
      <<: *env
      PROTOCOL: vmess
    volumes:
      - ./configs/torrc:/etc/tor/torrc:ro
      - ./configs/xray-vmess.json:/etc/xray/config.json:ro
      - ../output:/app/output
    networks:
      - crawl-net

  torcrawl-vless:
    build: *build
    container_name: torcrawl-vless
    restart: "no"
    cap_add: *caps
    environment:
      <<: *env
      PROTOCOL: vless
    volumes:
      - ./configs/torrc:/etc/tor/torrc:ro
      - ./configs/xray-vless.json:/etc/xray/config.json:ro
      - ../output:/app/output
    networks:
      - crawl-net

  torcrawl-anytls:
    build: *build
    container_name: torcrawl-anytls
    restart: "no"
    cap_add: *caps
    environment:
      <<: *env
      PROTOCOL: anytls
    volumes:
      - ./configs/torrc-obfs4:/etc/tor/torrc:ro
      - ./configs/xray-hysteria2.json:/etc/xray/config.json:ro
      - ../output:/app/output
    networks:
      - crawl-net

  # ===================================================================
  # Dual Capture (pre + post proxy traffic pairs)
  # ===================================================================
  pairs-mieru:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: pairs-mieru
    restart: "no"
    cap_add: [NET_ADMIN, NET_RAW]
    environment:
      PROTOCOL: mieru
      TARGET_TOTAL: ${TARGET_TOTAL:-10000}
      MAX_PCAPS: ${MAX_PCAPS:-10}
      CRAWL_URL: ${CRAWL_URL:-https://check.torproject.org}
      CRAWL_DEPTH: ${CRAWL_DEPTH:-1}
      CRAWL_PAUSE: ${CRAWL_PAUSE:-2}
      FETCH_NODES: "0"
      OUTPUT_DIR: /app/output_pairs
    volumes:
      - ./configs/torrc:/etc/tor/torrc:ro
      - ./configs/xray-hysteria2.json:/etc/xray/config.json:ro
      - ./entrypoints/entrypoint_pairs.sh:/entrypoint.sh:ro
      - ./capture/crawl_pcap_pairs.py:/app/docker/crawl_pcap_pairs.py:ro
      - ./configs/top1000.txt:/app/docker/configs/top1000.txt:ro
      - ../output_pairs:/app/output_pairs
